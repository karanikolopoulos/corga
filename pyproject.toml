[project]
name = "corga"
version = "0.2.0"
description = "A conversational travel assistant for Corfu, built with LangGraph."
readme = "README.md"
authors = [
    { name = "karanikolopoulos", email = "ckaranikolopoulos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "hydra-core>=1.3.7",
    "jinja2>=3.1.6",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.5",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.6",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.12",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "tzdata>=2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "commitizen>=4.19.0",
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.poe]
include = "tasks.toml"

[tool.commitizen]
name = "cz_conventional_commits"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
