[project]
name = "corga"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karanikolopoulos", email = "ckaranikolopoulos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.6.5",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "pydantic>=2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "tzdata>=2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "commitizen>=4.19.0",
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.poe]
include = 'tasks.toml'

[tool.commitizen]
name = "cz_conventional_commits"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs network or a real LLM endpoint",
    "model: downloads the sentence-transformers model",
]
addopts = "-m 'not integration and not model'"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
