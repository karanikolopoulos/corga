# One log file per run, next to the traces. Only CorGA logs at INFO; libraries only reach it with warnings.
version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
handlers:
  file:
    class: logging.FileHandler
    formatter: simple
    filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
root:
  level: WARNING
  handlers: [file]
loggers:
  corga:
    level: INFO
