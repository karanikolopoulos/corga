rules:
  _target_: corga.domain.planning.rules.PlanningRules
  walking:
    _target_: corga.domain.planning.geo.WalkingModel
    speed_kmh: ${oc.select:speed_kmh,4.5}
    detour_factor: ${oc.select:detour_factor,1.3}  # straight line → street distance
  max_leg_minutes: ${oc.select:max_leg_minutes,40}
  max_wait_minutes: ${oc.select:max_wait_minutes,20}
  max_stops: ${oc.select:max_stops,5}
  walk_penalty: ${oc.select:walk_penalty,0.2}  # ranking cost per minute walked
