# The settings every run uses; chat.yaml adds the weather source and the run folder.
defaults:
  - provider: oai-api  # `+model=...` overrides its default model
  - embedding: minilm
  - store: poi
  - retrieval: qdrant
  - rules

structured_method: json_schema  # native structured output on every provider (guided decoding on vLLM behind oai-api); function_calling | json_schema | json_mode | null (the client's default)
