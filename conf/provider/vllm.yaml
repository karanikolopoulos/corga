# A vLLM server through its OpenAI-compatible API
# the server needs tool calling: --enable-auto-tool-choice --tool-call-parser qwen3_xml
_target_: langchain_openai.ChatOpenAI
_convert_: all  # extra_body reaches the OpenAI SDK as plain dicts
model: ${oc.select:model,Qwen/Qwen3.8-27B}
base_url: ${oc.env:VLLM_BASE_URL,http://localhost:8000/v1}
api_key: ${oc.env:VLLM_API_KEY,EMPTY}
temperature: 0
timeout: 60
max_retries: 2
extra_body:  # vLLM options the OpenAI SDK does not know
  chat_template_kwargs:
    enable_thinking: false
