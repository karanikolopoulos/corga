# native structured output on every provider
structured_method: json_schema  # function_calling | json_schema | json_mode | null

hydra:
  run:
    dir: runs/${hydra:runtime.choices.provider}/${sanitize:${provider.model}}/${now:%Y-%m-%dT%H-%M-%S}
