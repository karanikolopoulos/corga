name: CI

on:
  push:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install dev tools only
        run: uv sync --locked --only-dev

      - name: Cache prek hook envs
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('prek.toml') }}

      - name: Run quality checks
        run: uv run poe quality

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install project and dev tools
        run: uv sync --locked

      - name: Run tests
        run: uv run poe test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t corga:ci .

      - name: Compose the config inside the image
        run: docker run --rm corga:ci --cfg job
